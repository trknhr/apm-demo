name: APM audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit that must be audited
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit committed Skill deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: '0.35.0'
          setup-only: true
      - name: Check committed deployment without rewriting it
        run: apm audit --ci
