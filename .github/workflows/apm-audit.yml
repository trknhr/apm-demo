name: APM audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit that must be audited
        required: true
        type: string
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  audit:
    name: Audit committed Skill deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: '0.35.0'
          setup-only: true
      - name: Check committed deployment without rewriting it
        run: apm audit --ci

  report:
    needs: audit
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the exact audited commit to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sha = os.environ['EXPECTED_SHA']
          assert sha == os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          result = os.environ['AUDIT_RESULT']
          body = {
              'state': 'success' if result == 'success' else 'failure',
              'context': 'APM deployment audit',
              'description': 'Audit of the updated PR commit: ' + result,
              'target_url': f'https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps(body).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as response:
              assert response.status == 201
          print('Reported', body['state'], 'for', sha)
          PY
